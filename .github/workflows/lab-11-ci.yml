name: Lab 11 Java CI
on:
  push:
    branches: [lab-11]
  pull_request:
    branches: [lab-11]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run tests
        run: mvn --batch-mode --no-transfer-progress clean test
